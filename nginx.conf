# Hashed build assets (/assets/index-*.js, fonts, images) are content-addressed,
# so browsers can cache them for a year. index.html itself is never cached,
# so new deploys are picked up immediately.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  location = /index.html {
    expires -1;
    add_header Cache-Control "no-store";
  }
}
